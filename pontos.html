<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

html{font-size:16px}
body{font-family:var(--fb);background:var(--bg);color:var(--creme);min-height:100dvh;padding-bottom:40px}
.topo{background:linear-gradient(135deg,#1a0e06,#0a0a0a);border-bottom:1px solid var(--borda);padding:14px 16px 10px;text-align:center}

.nav-links{display:flex;justify-content:flex-end;gap:16px;padding:5px 20px;background:#111;border-bottom:1px solid var(--borda)}
.nav-links a{font-size:11px;color:var(--cinza);text-decoration:none}
.nav-links a:hover{color:var(--ouro)}

/* FILTROS */
.filtros{padding:16px 20px;background:#111;border-bottom:1px solid var(--borda);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca{flex:1;min-width:160px;background:var(--card);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;color:var(--creme);font-size:13px;font-family:var(--fb);outline:none}
.busca::placeholder{color:var(--cinza)}
.busca:focus{border-color:var(--ouro)}
.sel{background:var(--card);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;color:var(--creme);font-size:13px;font-family:var(--fb);outline:none;cursor:pointer}
.sel:focus{border-color:var(--ouro)}
.sel option{background:#1a1a1a}
.contador{font-size:11px;color:var(--cinza);padding:0 4px;white-space:nowrap}

.tabs-rel{display:flex;gap:0;background:#111;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:none}
.tabs-rel::-webkit-scrollbar{display:none}
.tab-rel{padding:10px 18px;font-size:12px;font-weight:500;color:var(--cinza);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--fb);white-space:nowrap;transition:color .15s}
.tab-rel:hover{color:var(--ouro-lt)}
.tab-rel.active{color:var(--ouro-lt);border-bottom-color:var(--ouro)}

/* LISTA */
.lista{padding:20px;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.card-ponto{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.card-ponto:hover{border-color:rgba(201,168,76,.45)}
.card-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.badge-rel{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;flex-shrink:0}
.badge-umb{background:rgba(100,160,100,.18);color:#90d090;border:1px solid rgba(100,160,100,.3)}
.badge-can{background:rgba(160,100,30,.2);color:#e0b060;border:1px solid rgba(160,100,30,.3)}
.card-info{flex:1;min-width:0}
.card-nome{font-size:14px;font-weight:600;color:var(--ouro-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-entidade{font-size:11px;color:var(--cinza);margin-top:2px}
.card-icons{display:flex;gap:8px;flex-shrink:0}
.ic{width:20px;height:20px;opacity:.5;flex-shrink:0}
.ic.has{opacity:1}
.chevron{margin-left:4px;transition:transform .2s;color:var(--cinza);flex-shrink:0;font-size:14px}
.card-ponto.open .chevron{transform:rotate(180deg)}
.card-body{display:none;border-top:1px solid var(--borda);padding:16px}
.card-ponto.open .card-body{display:block}

/* LETRA */
.letra-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.75;color:#ddd;margin-bottom:12px;white-space:pre-line}
.letra-box em{color:var(--ouro);font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em}

/* YOUTUBE */
.yt-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:8px;overflow:hidden;margin-bottom:12px;background:#000}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

/* LINKS */
.ponto-links{display:flex;gap:8px;flex-wrap:wrap}
.btn-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:500;transition:opacity .15s}

.btn-drive{background:rgba(66,133,244,.12);color:#82b1ff;border:1px solid rgba(66,133,244,.2)}
.obs{font-size:11px;color:var(--cinza);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--cinza)}
.empty-ico{font-size:2.5rem;margin-bottom:12px}

/* MOBILE */
@media(max-width:500px){
  .filtros{gap:8px}
  .busca{min-width:100%}
  .card-nome{font-size:13px}

</style>

let relAtiva = "Todos";
let abertos = new Set();

// Preencher select de entidades
const sel = document.getElementById("selEnt");
ENTIDADES.forEach(e => {
  const o = document.createElement("option");
  o.value = e; o.textContent = e;
  sel.appendChild(o);
});

function setRel(btn) {
  document.querySelectorAll(".tab-rel").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  relAtiva = btn.dataset.rel;
  // Resetar filtro entidade ao trocar religião
  document.getElementById("selEnt").value = "";
  renderLista();
}

function filtrados() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const ent = document.getElementById("selEnt").value;
  return PONTOS.filter(p => {
    if (relAtiva !== "Todos" && p.religiao !== relAtiva) return false;
    if (ent && p.entidade !== ent) return false;
    if (q && !p.nome.toLowerCase().includes(q) && !p.entidade.toLowerCase().includes(q) && !p.letra.toLowerCase().includes(q)) return false;
    return true;
  });
}

function toggle(id) {
  if (abertos.has(id)) abertos.delete(id);
  else abertos.add(id);
  const el = document.getElementById("card-" + id);
  if (el) el.classList.toggle("open", abertos.has(id));
}

function renderLista() {
  const lista = document.getElementById("lista");
  const items = filtrados();
  document.getElementById("contador").textContent = items.length + " ponto" + (items.length !== 1 ? "s" : "");

  if (!items.length) {
    lista.innerHTML = '<div class="empty"><div class="empty-ico">🎵</div><p>Nenhum ponto encontrado.</p></div>';
    return;
  }

  lista.innerHTML = items.map(p => {
    const isOpen = abertos.has(p.id);
    const badge = p.religiao === "Umbanda"
      ? '<span class="badge-rel badge-umb">Umbanda</span>'
      : '<span class="badge-rel badge-can">Candomblé</span>';
    const hasYt = p.ytid ? "has" : "";
    const hasDrv = p.drive ? "has" : "";

    let bodyHtml = "";
    if (p.ytid) {
      bodyHtml += `<div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${p.ytid}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    }
    if (p.letra) {
      bodyHtml += `<div class="letra-box">${p.letra}</div>`;
    }
    const links = [];
    if (p.ytid) links.push(`<a class="btn-link btn-yt" href="https://youtu.be/${p.ytid}" target="_blank">▶ YouTube</a>`);
    if (p.drive) links.push(`<a class="btn-link btn-drive" href="${p.drive}" target="_blank">🎵 Áudios no Drive</a>`);
    if (links.length) bodyHtml += `<div class="ponto-links">${links.join("")}</div>`;
    if (p.obs) bodyHtml += `<div class="obs">ℹ️ ${p.obs}</div>`;

    return `<div class="card-ponto${isOpen?' open':''}" id="card-${p.id}">
  <div class="card-header" onclick="toggle('${p.id}')">
    ${badge}
    <div class="card-info">
      <div class="card-nome">${p.nome}</div>
      <div class="card-entidade">${p.entidade}</div>
    </div>
    <div class="card-icons">
      <svg class="ic ${hasYt}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="#ff6b6b"><path d="M22.54 6.42A2.78 2.78 0 0 0 20.77 4.6C19.05 4 12 4 12 4s-7.05 0-8.77.54A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.23 19.4C4.95 20 12 20 12 20s7.05 0 8.77-.54a2.78 2.78 0 0 0 1.77-1.82A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
      <svg class="ic ${hasDrv}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="#82b1ff"><path d="M9 18l-6-3.5L6.5 8l8.5 1 4-6.5L23 6l-3 9H9z"/><path d="M9 18l5-2 3 5-8-3z"/></svg>
    </div>
    <span class="chevron">▾</span>
  </div>
  <div class="card-body">${bodyHtml}</div>
</div>`;

}
