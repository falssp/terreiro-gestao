.ac-ent{font-size:10px;color:var(--cinza);margin-top:2px}
#player{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--borda);z-index:100;display:none}

.pl-prog{height:100%;background:var(--ouro);width:0%}
.pl-corpo{display:flex;align-items:center;gap:10px;padding:10px 16px}
.pl-info{flex:1;min-width:0}
.pl-nome{font-size:12px;font-weight:600;color:var(--ouro-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ent{font-size:10px;color:var(--cinza)}
.pl-ctrls{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pl-btn{background:none;border:none;color:var(--cinza);cursor:pointer;padding:7px;font-size:18px;line-height:1;border-radius:6px;transition:color .15s}

const ENTIDADES=["Baianos", "Boiadeiros", "Caboclos", "Ciganos", "Crianças / Erês", "Cura", "Exus e Pombagiras", "Ex├║s e Pombas Gira", "Geral / Abertura", "Iansã", "Iemanjá", "Malandros", "Marinheiros", "Nanã Buruquê", "Ogum", "Oxalá", "Oxum", "Oxumarê", "Oxóssi", "Ox├│ssi", "Pontos para Gira", "Pretos-Velhos", "Toques de atabaque", "Xangô", "Xang├┤", "Zé Pilintra"];
const sel=document.getElementById('selEnt');
ENTIDADES.forEach(function(e){var o=document.createElement('option');o.value=e;o.textContent=e+' ('+(CATALOG[e]||[]).length+')';sel.appendChild(o);});
var urlParams=new URLSearchParams(window.location.search);
var entParam=urlParams.get('ent');
if(entParam&&CATALOG[entParam])sel.value=entParam;
var listaAtual=[],idxAtual=-1,tocando=false,timerProg=null;
function getListaFiltrada(){
  var ent=sel.value,busca=document.getElementById('busca').value.toLowerCase().trim(),todos=[];
  if(ent){(CATALOG[ent]||[]).forEach(function(a){todos.push({...a,entidade:ent});});}
  else{ENTIDADES.forEach(function(e){(CATALOG[e]||[]).forEach(function(a){todos.push({...a,entidade:e});});});}
  if(busca)todos=todos.filter(function(a){return a.nome.toLowerCase().includes(busca)||a.entidade.toLowerCase().includes(busca);});
  return todos;
}
function renderLista(){
  listaAtual=getListaFiltrada();
  document.getElementById('contador').textContent=listaAtual.length+' áudio(s)';
  if(!listaAtual.length){document.getElementById('lista').innerHTML='<div class="empty"><div class="empty-ico">&#127925;</div><p>Nenhum ponto encontrado.</p></div>';return;}
  document.getElementById('lista').innerHTML=listaAtual.map(function(a,i){
    return '<div class="audio-card'+(idxAtual===i?' playing':'')+'" id="ac-'+i+'" onclick="tocar('+i+')">'
      +'<span class="ac-num">'+(i+1)+'</span>'
      +'<div class="ac-play"><span>'+(idxAtual===i&&tocando?'&#9646;&#9646;':'&#9654;')+'</span></div>'
      +'<div class="ac-info"><div class="ac-nome">'+a.nome+'</div><div class="ac-ent">'+a.entidade+'</div></div>'
      +'</div>';
  }).join('');
}
function tocar(idx){
  var audio=document.getElementById('audio');
  if(idxAtual===idx&&!audio.paused){audio.pause();tocando=false;atualizarUI();return;}
  idxAtual=idx;var item=listaAtual[idx];if(!item)return;
  audio.src=item.url;
  audio.play().then(function(){tocando=true;atualizarUI();document.getElementById('pl-nome').textContent=item.nome;document.getElementById('pl-ent').textContent=item.entidade;document.getElementById('player').classList.add('ativo');iniciarProg();}).catch(function(e){console.warn(e);});
}
function togglePlay(){var audio=document.getElementById('audio');if(audio.paused){audio.play();tocando=true;}else{audio.pause();tocando=false;}atualizarUI();}
function proximo(){if(listaAtual.length)tocar((idxAtual+1)%listaAtual.length);}
function anterior(){if(!listaAtual.length)return;var audio=document.getElementById('audio');if(audio.currentTime>3){audio.currentTime=0;return;}tocar((idxAtual-1+listaAtual.length)%listaAtual.length);}
function fecharPlayer(){var audio=document.getElementById('audio');audio.pause();audio.src='';tocando=false;idxAtual=-1;document.getElementById('player').classList.remove('ativo');clearInterval(timerProg);renderLista();}
function seekPlayer(e){var audio=document.getElementById('audio');if(!audio.duration)return;var b=document.getElementById('pl-barra');audio.currentTime=((e.clientX-b.getBoundingClientRect().left)/b.offsetWidth)*audio.duration;}
function atualizarUI(){document.getElementById('pl-play').innerHTML=tocando?'&#9646;&#9646;':'&#9654;';document.querySelectorAll('.audio-card').forEach(function(el,i){el.classList.toggle('playing',i===idxAtual);var ps=el.querySelector('.ac-play span');if(ps)ps.innerHTML=i===idxAtual&&tocando?'&#9646;&#9646;':'&#9654;';});}
function fmt(s){if(!s||isNaN(s))return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60);}
function iniciarProg(){clearInterval(timerProg);timerProg=setInterval(function(){var audio=document.getElementById('audio');if(audio.duration){document.getElementById('pl-prog').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('pl-tempo').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);}},500);}
document.getElementById('audio').addEventListener('ended',function(){proximo();});
document.getElementById('audio').addEventListener('play',function(){tocando=true;atualizarUI();});
document.getElementById('audio').addEventListener('pause',function(){tocando=false;atualizarUI();});
renderLista();
</script>
