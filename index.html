<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Terreiro Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d0d;--ouro:#c9a84c;--ouro-lt:#e8c96a;--creme:#fff;--cinza:#999;--borda:rgba(201,168,76,.18);--card:rgba(255,255,255,.03);--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--creme);font-family:'Inter',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.topo{text-align:center;margin-bottom:48px}
.topo h1{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--ouro-lt);letter-spacing:.08em}
.topo p{font-size:12px;color:var(--cinza);margin-top:6px;letter-spacing:.15em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%;max-width:800px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:24px 28px;text-decoration:none;color:var(--creme);transition:border-color .2s}
.card:hover{border-color:rgba(201,168,76,.5)}
.card-nome{font-family:'Cinzel',serif;font-size:1rem;color:var(--ouro-lt);margin-bottom:6px}
.card-sub{font-size:11px;color:var(--cinza);text-transform:uppercase;letter-spacing:.1em}
.rodape{margin-top:48px;font-size:11px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="topo">
  <h1>&#10022; Terreiro Gestão &#10022;</h1>
  <p>Sistema de gestão para terreiros de Umbanda</p>
</div>
<div class="grid">
  <a class="card" href="ile-ase-vodun/">
    <div class="card-nome">Ile Ase Vodun Ogum Ayres</div>
    <div class="card-sub">Terreiro de Umbanda &middot; São Paulo</div>
  </a>
</div>
<div class="rodape">terreiro-gestao &middot; falssp</div>
</body>
</html>
