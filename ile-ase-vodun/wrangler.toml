name = "terreiro-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "terreiro-pontos"

# Variáveis de ambiente — definir no Cloudflare Dashboard:
# Workers > terreiro-proxy > Settings > Variables
#
#   ADMIN_TOKEN  — token secreto para upload/deleção de fotos
#   GAS_URL      — URL do Apps Script (Web App)
#
# Ou via CLI:
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put GAS_URL
[vars]
# (nenhuma variável em texto puro — usar Secrets no dashboard)
